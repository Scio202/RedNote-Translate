name: Build

# Catches a broken build on the way in, rather than when a tag is already cut.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
