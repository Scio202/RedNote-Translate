name: Release APK

# Maintainer notes
# ----------------
# Publish:  git tag v1.0.0  then  git push --tags
#
# Signing: with no keystore the APK is debug-signed. That installs fine, but every
# runner generates a different debug key, so an update refuses to install over an
# earlier release - Android treats it as a different app. To sign properly, once:
#
#   keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 #           -validity 10000 -alias release
#   base64 -w0 release.jks
#
# Then add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD. Keep release.jks out of the repo; losing it means no more in-place
# updates, ever.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Signing key, if one has been set up. Without it the APK is debug-signed, which
      # installs fine but gets a fresh signature on every runner - so an update will
      # refuse to install over a previous release. See README.
      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the file after the tag
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "rednote-translate-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: rednote-translate-*.apk
          generate_release_notes: true
          body: |
            Sideload this APK, then turn the service on under
            **Settings › Accessibility › Installed apps › RedNote Translate**.

            Translation runs on-device by default and needs no account. Google and
            DeepSeek are optional back ends you can pick in the app.
